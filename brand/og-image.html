<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; background:#080A0E; font-family: Arial, sans-serif; }
  .wrap { position:relative; width:1200px; height:630px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .glow { position:absolute; top:-180px; left:50%; transform:translateX(-50%); width:900px; height:560px;
    background: radial-gradient(ellipse at center, rgba(47,212,196,.22) 0%, rgba(47,212,196,.05) 45%, transparent 70%); }
  .grid { position:absolute; inset:0; background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:56px 56px; mask-image: radial-gradient(ellipse at 50% 45%, black 10%, transparent 70%); }
  .logo-row { display:flex; align-items:center; gap:22px; z-index:2; }
  .word { font-size:96px; font-weight:800; letter-spacing:2px; color:#F2F4F7; }
  .tag { margin-top:26px; font-size:30px; color:#9AA3B2; z-index:2; text-align:center; max-width:820px; }
  .badge { margin-top:38px; display:flex; gap:14px; z-index:2; }
  .chip { background:rgba(47,212,196,.1); border:1px solid rgba(47,212,196,.3); color:#2FD4C4;
    font-size:20px; padding:10px 22px; border-radius:999px; font-weight:600; }
</style></head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="logo-row">
      <svg width="92" height="92" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 54L54 10M30 10H54V34" stroke="url(#g)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="g" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
          <stop stop-color="#2FD4C4"/><stop offset="1" stop-color="#14B8A6"/>
        </linearGradient></defs>
      </svg>
      <span class="word">VECTA</span>
    </div>
    <p class="tag">Marketing de performance para clínicas estéticas y odontológicas en Colombia</p>
    <div class="badge">
      <span class="chip">Pacientes reales</span>
      <span class="chip">ROI por procedimiento</span>
    </div>
  </div>
</body></html>
